<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#125438" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" stroke="url(#shieldBorder)" stroke-width="1.2" />

  <!-- Packaging Hexagon / Shield Outer Grid -->
  <path d="M32 12 L50 22.5 V41.5 L32 52 L14 41.5 V22.5 Z" stroke="#a7f3d0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Bio Leaf Center (Smart Sustainable Packaging) -->
  <path d="M32 16 C32 16 46 22 45 36 C44.2 46 34 49 32 49 C30 49 19.8 46 19 36 C18 22 32 16 32 16 Z" fill="url(#leafGrad)" />

  <!-- Leaf Central Vein & Tech Circuit Nodes -->
  <path d="M32 20 V46" stroke="#064e3b" stroke-width="2" stroke-linecap="round" />
  <path d="M32 28 L38 23" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round" />
  <path d="M32 34 L26 29" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round" />
  <path d="M32 40 L38 35" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round" />

  <!-- Glowing AI Sparkle Accent -->
  <circle cx="44" cy="18" r="2.5" fill="#fef08a" />
  <path d="M44 13 V23 M39 18 H49" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />
</svg>